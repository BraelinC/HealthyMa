<!DOCTYPE html>
<html>
<head>
    <title>Test Google Vision API Key</title>
    <style>
        body { 
            font-family: system-ui; 
            max-width: 800px; 
            margin: 50px auto; 
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        button { 
            background: #3b82f6; 
            color: white; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 6px; 
            cursor: pointer;
            font-size: 16px;
            margin: 10px 5px;
        }
        button:hover { background: #2563eb; }
        .result { 
            margin: 20px 0; 
            padding: 15px; 
            background: #262626; 
            border-radius: 8px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 12px;
        }
        .success { background: #065f46; color: #34d399; }
        .error { background: #7f1d1d; color: #f87171; }
        .warning { background: #78350f; color: #fbbf24; }
    </style>
</head>
<body>
    <h1>🔑 Google Vision API Key Test</h1>
    
    <button onclick="testBackend()">1. Test Backend Endpoint</button>
    <button onclick="testDirectAPI()">2. Test Direct API Call</button>
    <button onclick="checkAPIStatus()">3. Check API Status</button>
    
    <div id="result"></div>

    <script>
        const API_KEY = 'AIzaSyBZNfvaAwCwgZHi4a9MKs8CkaRaMAxUPm4';
        const resultDiv = document.getElementById('result');
        
        // Test backend endpoint
        async function testBackend() {
            resultDiv.innerHTML = 'Testing backend endpoint...';
            try {
                const response = await fetch('/api/test-vision');
                const data = await response.json();
                
                let statusClass = data.success ? 'success' : 'error';
                if (data.apiKeyWorks && !data.success) statusClass = 'warning';
                
                resultDiv.className = `result ${statusClass}`;
                resultDiv.innerHTML = `Backend Test Results:
====================
Success: ${data.success}
HTTP Status: ${data.status}
API Key Works: ${data.apiKeyWorks}
Message: ${data.message}

Response:
${JSON.stringify(data.response, null, 2)}`;
                
                if (data.response?.error) {
                    interpretError(data.response.error);
                }
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `Backend test failed: ${error.message}`;
            }
        }
        
        // Test direct API call from browser
        async function testDirectAPI() {
            resultDiv.innerHTML = 'Testing direct API call...';
            
            // Tiny test image
            const testImage = 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
            
            const request = {
                requests: [{
                    image: { content: testImage },
                    features: [
                        { type: 'LABEL_DETECTION', maxResults: 1 }
                    ]
                }]
            };
            
            try {
                const response = await fetch(
                    `https://vision.googleapis.com/v1/images:annotate?key=${API_KEY}`,
                    {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(request)
                    }
                );
                
                const data = await response.json();
                
                resultDiv.className = `result ${response.ok ? 'success' : 'error'}`;
                resultDiv.innerHTML = `Direct API Test Results:
========================
HTTP Status: ${response.status}
Success: ${response.ok}

Response:
${JSON.stringify(data, null, 2)}`;
                
                if (data.error) {
                    interpretError(data.error);
                }
                
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = `Direct API test failed: ${error.message}
                
This might be a CORS issue (normal for browser-to-API calls).
Please use the backend test instead.`;
            }
        }
        
        // Check API status
        async function checkAPIStatus() {
            resultDiv.innerHTML = 'Checking API configuration...';
            
            const checks = [];
            
            // Check key format
            if (API_KEY.startsWith('AIza')) {
                checks.push('✅ API key format is valid');
            } else {
                checks.push('❌ API key format seems invalid');
            }
            
            // Check key length
            if (API_KEY.length === 39) {
                checks.push('✅ API key length is correct (39 chars)');
            } else {
                checks.push(`⚠️ API key length is ${API_KEY.length} (expected 39)`);
            }
            
            resultDiv.className = 'result warning';
            resultDiv.innerHTML = `API Configuration Check:
========================
${checks.join('\n')}

Common Issues to Check:
=======================
1. Vision API Enabled?
   - Go to: https://console.cloud.google.com/apis/library/vision.googleapis.com
   - Make sure it's ENABLED for your project

2. Billing Enabled?
   - Go to: https://console.cloud.google.com/billing
   - Even free tier requires billing to be enabled

3. API Key Restrictions?
   - Go to: https://console.cloud.google.com/apis/credentials
   - Check if key has IP or referrer restrictions

4. Quota Exceeded?
   - Free tier: 1,000 requests/month
   - Check: https://console.cloud.google.com/apis/api/vision.googleapis.com/quotas

Current API Key: ${API_KEY}`;
        }
        
        // Interpret error codes
        function interpretError(error) {
            const errorInterpretations = {
                403: `
FORBIDDEN - API Key Issues:
- Vision API not enabled for this project
- API key has IP/referrer restrictions
- Billing not enabled in Google Cloud`,
                401: `
UNAUTHORIZED - Invalid API Key:
- API key is invalid or expired
- Wrong project selected`,
                429: `
QUOTA EXCEEDED:
- Free tier limit reached (1,000/month)
- Rate limit exceeded`,
                400: `
BAD REQUEST:
- Invalid image format
- Request structure incorrect`
            };
            
            if (error.code && errorInterpretations[error.code]) {
                resultDiv.innerHTML += `\n\n🔍 Error Interpretation:\n${errorInterpretations[error.code]}`;
            }
        }
        
        // Auto-run backend test
        testBackend();
    </script>
</body>
</html>
