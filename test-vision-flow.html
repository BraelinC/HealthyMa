<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Google Vision API Flow</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
        }
        h1 {
            color: #4ade80;
            text-align: center;
        }
        .test-section {
            background: #262626;
            padding: 20px;
            border-radius: 8px;
            margin: 20px 0;
        }
        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #2563eb;
        }
        button:disabled {
            background: #6b7280;
            cursor: not-allowed;
        }
        .status {
            margin: 10px 0;
            padding: 10px;
            border-radius: 4px;
            background: #374151;
        }
        .success {
            background: #065f46;
            color: #34d399;
        }
        .error {
            background: #7f1d1d;
            color: #f87171;
        }
        pre {
            background: #111;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .log-entry {
            margin: 2px 0;
            font-family: monospace;
        }
        .log-debug { color: #9ca3af; }
        .log-info { color: #60a5fa; }
        .log-success { color: #34d399; }
        .log-error { color: #f87171; }
    </style>
</head>
<body>
    <h1>🌐 Google Vision API Test Flow</h1>
    
    <div class="test-section">
        <h2>1. Test Backend Endpoint Directly</h2>
        <p>This tests if the Vision API backend is working</p>
        <button id="testBackend">Test /api/detect-ingredients</button>
        <div id="backendStatus" class="status"></div>
    </div>

    <div class="test-section">
        <h2>2. Test Frontend Module</h2>
        <p>This tests the full detection flow through foodDetection.ts</p>
        <button id="testFrontend">Test detectFoods()</button>
        <div id="frontendStatus" class="status"></div>
    </div>

    <div class="test-section">
        <h2>3. Console Logs</h2>
        <div id="logs" style="max-height: 400px; overflow-y: auto;">
            <pre id="logContent"></pre>
        </div>
    </div>

    <script type="module">
        // Test image: small red square
        const TEST_IMAGE = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==';
        
        const logContent = document.getElementById('logContent');
        
        function addLog(message, type = 'debug') {
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            logContent.appendChild(entry);
            logContent.scrollTop = logContent.scrollHeight;
        }

        // Test backend endpoint
        document.getElementById('testBackend').addEventListener('click', async (e) => {
            const button = e.target;
            const status = document.getElementById('backendStatus');
            
            button.disabled = true;
            status.textContent = 'Testing backend endpoint...';
            status.className = 'status';
            
            addLog('Starting backend test...', 'info');
            
            try {
                addLog('Calling /api/detect-ingredients', 'debug');
                
                const response = await fetch('/api/detect-ingredients', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        image: TEST_IMAGE
                    })
                });
                
                addLog(`Response status: ${response.status}`, response.ok ? 'info' : 'error');
                
                if (!response.ok) {
                    const errorText = await response.text();
                    throw new Error(`HTTP ${response.status}: ${errorText}`);
                }
                
                const data = await response.json();
                addLog(`Success! Detected ${data.ingredients?.length || 0} ingredients`, 'success');
                
                if (data.raw) {
                    addLog(`Raw stats: ${data.raw.objects} objects, ${data.raw.labels} labels`, 'debug');
                }
                
                status.className = 'status success';
                status.innerHTML = `✅ Backend working!<br>Detected: ${data.ingredients?.length || 0} items<br><pre>${JSON.stringify(data, null, 2)}</pre>`;
                
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
                status.className = 'status error';
                status.textContent = `❌ Backend error: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        });

        // Test frontend module
        document.getElementById('testFrontend').addEventListener('click', async (e) => {
            const button = e.target;
            const status = document.getElementById('frontendStatus');
            
            button.disabled = true;
            status.textContent = 'Loading frontend module...';
            status.className = 'status';
            
            addLog('Starting frontend test...', 'info');
            
            try {
                // Dynamically import the frontend module
                addLog('Importing foodDetection module...', 'debug');
                const { detectFoods, getModelInfo } = await import('./client/src/lib/foodDetection.ts');
                
                // Get model info
                const modelInfo = getModelInfo();
                addLog(`Model: ${modelInfo.name}`, 'info');
                addLog(`Provider: ${modelInfo.provider}`, 'debug');
                
                // Test detection
                addLog('Calling detectFoods()...', 'debug');
                const detections = await detectFoods(TEST_IMAGE);
                
                addLog(`Success! Detected ${detections.length} items`, 'success');
                
                if (detections.length > 0) {
                    detections.forEach((item, i) => {
                        addLog(`  ${i + 1}. ${item.name} - ${item.amount}${item.unit} (${(item.confidence * 100).toFixed(1)}%)`, 'info');
                    });
                }
                
                status.className = 'status success';
                status.innerHTML = `✅ Frontend working!<br>Detected: ${detections.length} items<br><pre>${JSON.stringify(detections, null, 2)}</pre>`;
                
            } catch (error) {
                addLog(`Error: ${error.message}`, 'error');
                status.className = 'status error';
                status.textContent = `❌ Frontend error: ${error.message}`;
            } finally {
                button.disabled = false;
            }
        });

        // Override console methods to capture logs
        const originalLog = console.log;
        const originalError = console.error;
        
        console.log = function(...args) {
            originalLog.apply(console, args);
            addLog(args.join(' '), 'debug');
        };
        
        console.error = function(...args) {
            originalError.apply(console, args);
            addLog(args.join(' '), 'error');
        };
        
        addLog('Test page loaded and ready', 'success');
        addLog('Click the buttons above to test the Vision API flow', 'info');
    </script>
</body>
</html>
