
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Chef Hat Base -->
  <ellipse cx="100" cy="160" rx="45" ry="12" fill="#8B5CF6" opacity="0.3"/>
  
  <!-- Hat Band -->
  <rect x="55" y="145" width="90" height="15" rx="7" fill="#7C3AED"/>
  
  <!-- Main Hat Body -->
  <path d="M 60 145 Q 60 120 80 105 Q 100 90 120 105 Q 140 120 140 145 L 60 145 Z" fill="#A855F7"/>
  
  <!-- Hat Pleats/Folds -->
  <path d="M 70 145 Q 70 125 85 115" stroke="#7C3AED" stroke-width="2" fill="none"/>
  <path d="M 85 145 Q 85 120 100 110" stroke="#7C3AED" stroke-width="2" fill="none"/>
  <path d="M 115 145 Q 115 120 130 115" stroke="#7C3AED" stroke-width="2" fill="none"/>
  
  <!-- Hat Top Puff -->
  <circle cx="100" cy="105" r="25" fill="#C084FC"/>
  <circle cx="90" cy="95" r="15" fill="#DDD6FE" opacity="0.7"/>
  <circle cx="110" cy="100" r="12" fill="#DDD6FE" opacity="0.5"/>
  
  <!-- Sparkle Effects -->
  <g fill="#F3E8FF">
    <circle cx="75" cy="130" r="2"/>
    <circle cx="125" cy="125" r="1.5"/>
    <circle cx="115" cy="85" r="2"/>
    <circle cx="85" cy="80" r="1"/>
  </g>
  
  <!-- App Name Text -->
  <text x="100" y="185" font-family="Arial, sans-serif" font-size="24" font-weight="bold" text-anchor="middle" fill="#7C3AED">NutriMa</text>
  
  <!-- Subtitle -->
  <text x="100" y="200" font-family="Arial, sans-serif" font-size="10" text-anchor="middle" fill="#8B5CF6">AI Meal Planning</text>
</svg>
