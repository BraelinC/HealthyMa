
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download NutriMa Logo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 2rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: white;
        }
        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 2rem;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .logo-preview {
            background: white;
            border-radius: 15px;
            padding: 2rem;
            margin: 2rem 0;
            display: inline-block;
        }
        .download-btn {
            background: #7C3AED;
            color: white;
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            margin: 10px;
            text-decoration: none;
            display: inline-block;
            transition: background 0.3s;
        }
        .download-btn:hover {
            background: #6D28D9;
        }
        h1 {
            margin-bottom: 1rem;
        }
        .formats {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 2rem;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🍳 NutriMa Logo Download</h1>
        <p>Your AI-powered meal planning app logo with the purple hat theme!</p>
        
        <div class="logo-preview">
            <img src="/nutrima-logo.svg" alt="NutriMa Logo" width="200" height="200">
        </div>
        
        <div class="formats">
            <a href="/nutrima-logo.svg" download="nutrima-logo.svg" class="download-btn">
                📁 Download SVG
            </a>
            <button onclick="downloadAsPNG()" class="download-btn">
                🖼️ Download PNG
            </button>
            <button onclick="downloadAsICO()" class="download-btn">
                🔷 Download ICO
            </button>
            <button onclick="downloadAsPDF()" class="download-btn">
                📄 Download PDF
            </button>
        </div>
        
        <p style="margin-top: 2rem; font-size: 14px; opacity: 0.8;">
            Perfect for your app favicon, marketing materials, and branding!
        </p>
    </div>

    <script>
        function downloadAsPNG() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 512;
            canvas.height = 512;
            
            const img = new Image();
            img.onload = function() {
                ctx.drawImage(img, 0, 0, 512, 512);
                const link = document.createElement('a');
                link.download = 'nutrima-logo.png';
                link.href = canvas.toDataURL();
                link.click();
            };
            img.src = '/nutrima-logo.svg';
        }
        
        function downloadAsICO() {
            // For ICO, we'll download the PNG and user can convert using online tools
            downloadAsPNG();
            setTimeout(() => {
                alert('PNG downloaded! You can convert to ICO using online converters like favicon.io');
            }, 500);
        }
        
        function downloadAsPDF() {
            // Create a new window with printable content
            const printWindow = window.open('', '_blank');
            printWindow.document.write(`
                <!DOCTYPE html>
                <html>
                <head>
                    <title>NutriMa Logo - PDF</title>
                    <style>
                        body { margin: 0; padding: 40px; text-align: center; font-family: Arial, sans-serif; }
                        .logo { max-width: 400px; height: auto; }
                        .info { margin-top: 20px; color: #666; }
                    </style>
                </head>
                <body>
                    <img src="/nutrima-logo.svg" alt="NutriMa Logo" class="logo">
                    <div class="info">
                        <h2>NutriMa - AI-Powered Meal Planning</h2>
                        <p>Professional Logo Package</p>
                    </div>
                </body>
                </html>
            `);
            printWindow.document.close();
            
            // Wait for image to load, then trigger print dialog
            setTimeout(() => {
                printWindow.print();
            }, 1000);
        }
    </script>
</body>
</html>
