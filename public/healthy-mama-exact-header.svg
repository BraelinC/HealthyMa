<svg width="200" height="40" viewBox="0 0 200 40" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Exact gradient from your app header -->
    <linearGradient id="iconGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Text gradient -->
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#8B5CF6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366F1;stop-opacity:1" />
    </linearGradient>
    
    <!-- Shadow -->
    <filter id="shadow">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Purple circular icon background (exact size from your app) -->
  <circle cx="20" cy="20" r="12" fill="url(#iconGradient)" filter="url(#shadow)"/>
  
  <!-- HandPlatter icon (simplified to match your app exactly) -->
  <g transform="translate(14, 14)" fill="white">
    <!-- Main plate shape -->
    <ellipse cx="6" cy="7" rx="5" ry="3" fill="none" stroke="white" stroke-width="1.2"/>
    <!-- Handle/stem -->
    <rect x="5.5" y="10" width="1" height="2" fill="white"/>
    <!-- Base -->
    <rect x="4" y="12" width="4" height="0.8" rx="0.4" fill="white"/>
  </g>
  
  <!-- "Healthy Mama" text (exact font and positioning from your app) -->
  <text x="40" y="16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="url(#textGradient)">Healthy</text>
  <text x="40" y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="700" fill="url(#textGradient)">Mama</text>
</svg>