<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Healthy Mama Logo</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: white;
            border-radius: 16px;
            padding: 40px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            max-width: 500px;
            width: 100%;
        }
        .logo-preview {
            width: 200px;
            height: 200px;
            border-radius: 12px;
            margin: 0 auto 30px;
            border: 3px solid #f3f4f6;
        }
        h1 {
            color: #374151;
            margin-bottom: 16px;
            font-size: 28px;
            font-weight: 700;
        }
        p {
            color: #6b7280;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .download-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 14px 32px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: transform 0.2s ease;
        }
        .download-btn:hover {
            transform: translateY(-2px);
        }
        .formats {
            margin-top: 20px;
            color: #9ca3af;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div style="text-align: center; margin-bottom: 30px;">
            <div style="display: inline-block; padding: 20px; background: white; border: 2px solid #e5e7eb; border-radius: 12px;">
                <img src="/healthy-mama-exact-header.svg" alt="Exact Header Logo" style="width: 240px; height: 40px;">
            </div>
            <p style="margin: 15px 0 0 0; font-size: 14px; color: #6b7280;">Exact logo from your app header</p>
        </div>
        
        <h1>Healthy Mama Logo</h1>
        <p>Download the exact logo from your app header - purple circular icon with HandPlatter symbol and "Healthy Mama" text.</p>
        
        <div style="text-align: center;">
            <a href="/healthy-mama-exact-header.svg" download="healthy-mama-header-logo.svg" class="download-btn">
                Download Header Logo (SVG)
            </a>
        </div>
        
        <div class="formats">
            SVG format: Perfect for any size • Matches your app exactly
        </div>
    </div>
</body>
</html>
